services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${VERASIG_DB_USER:-verasig}
      POSTGRES_PASSWORD: ${VERASIG_DB_PASSWORD:-verasig}
      POSTGRES_DB: ${VERASIG_DB_NAME:-verasig}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VERASIG_DB_USER:-verasig}"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: ./apps/backend
    env_file: [apps/backend/.env]
    environment:
      VERASIG_DB_HOST: db
      VERASIG_DB_PORT: "5432"
    volumes:
      - ./secrets:/secrets:ro     # read-only provided secrets (gitignored)
      - tgsession:/session        # writable Telegram session (named volume)
    depends_on:
      db:
        condition: service_healthy
    command: ["health"]

volumes:
  pgdata: {}
  tgsession: {}
