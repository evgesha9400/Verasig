[project]
name = "verasig"
version = "0.1.0"
description = "Proof-first Telegram signal-provider verification"
readme = "README.md"
authors = [
    { name = "Evgeny", email = "aleshiner@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.109.1",
    "bcrypt>=5.0.0",
    "cryptography>=48.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "regex>=2026.6.28",
    "sqlalchemy>=2.0.50",
    "sse-starlette>=3.4.4",
    "stripe>=16.1.0",
    "telethon>=1.43.2",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "testcontainers[postgres]>=4.14.2",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["verasig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
