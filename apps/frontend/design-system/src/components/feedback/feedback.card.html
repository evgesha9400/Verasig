<!-- @dsCard group="Components" viewport="700x480" name="Feedback — banner, tooltip, dialog, toast" subtitle="Alerts, tooltips, modal dialog and toasts" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../../styles.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg-app);
      }
      .grp {
        margin-bottom: 20px;
      }
      .lab {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
    <script
      crossorigin
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script src="../../../_ds_bundle.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { Banner, Tooltip, Dialog, Toast, Button, IconButton, Badge } =
        window.VerasigDesignSystem_fd565b
      const { useState } = React
      const Refresh = () => (
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5" />
        </svg>
      )
      const Alert = () => (
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M10.3 4 2.6 18a1.5 1.5 0 0 0 1.3 2.2h16.2A1.5 1.5 0 0 0 21.4 18L13.7 4a1.5 1.5 0 0 0-2.6 0Z" />
          <path d="M12 9v4M12 17h.01" />
        </svg>
      )

      function Demo() {
        const [open, setOpen] = useState(false)
        return (
          <div>
            <div className="grp">
              <div className="lab">Banner</div>
              <div className="stack">
                <Banner tone="rejected" title="Signal rejected" onClose={() => {}}>
                  3 of 12 sources disagreed beyond tolerance — quarantined
                  automatically.
                </Banner>
                <Banner tone="pending" title="Awaiting quorum">
                  Holding SIG-7F2A until at least 8 sources respond.
                </Banner>
              </div>
            </div>
            <div className="grp">
              <div className="lab">Tooltip · Dialog trigger</div>
              <div className="row">
                <Tooltip label="Re-run verification" shortcut="R">
                  <IconButton label="Refresh" variant="solid">
                    <Refresh />
                  </IconButton>
                </Tooltip>
                <Tooltip label="Quorum reached 11:32:04" side="bottom">
                  <Badge tone="verified" dot>
                    Verified
                  </Badge>
                </Tooltip>
                <Button variant="danger" onClick={() => setOpen(true)}>
                  Reject signal…
                </Button>
              </div>
            </div>
            <div className="grp" style={{ marginBottom: 0 }}>
              <div className="lab">Toast</div>
              <div className="row">
                <Toast
                  tone="verified"
                  title="Signal verified"
                  time="11:32:04"
                  onClose={() => {}}
                >
                  SIG-7F2A reached quorum across 12 sources.
                </Toast>
                <Toast tone="info" title="Provider added" time="11:30">
                  Stork is now available as a source.
                </Toast>
              </div>
            </div>
            <Dialog
              open={open}
              onClose={() => setOpen(false)}
              icon={<Alert />}
              title="Reject this signal?"
              description="It will be quarantined and downstream consumers won't receive it."
              footer={
                <>
                  <Button variant="ghost" onClick={() => setOpen(false)}>
                    Cancel
                  </Button>
                  <Button variant="danger" onClick={() => setOpen(false)}>
                    Reject signal
                  </Button>
                </>
              }
            >
              Rejecting{' '}
              <strong
                style={{ color: 'var(--text-strong)', fontFamily: 'var(--font-mono)' }}
              >
                SIG-7F2A
              </strong>{' '}
              removes it from the live feed immediately.
            </Dialog>
          </div>
        )
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />)
    </script>
  </body>
</html>
