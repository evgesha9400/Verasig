<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../../styles.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg-app);
      }
      .grp {
        margin-bottom: 22px;
      }
      .lab {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
    </style>
    <script
      crossorigin
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script src="../../../_ds_bundle.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { Button, IconButton, Badge, Tag, Avatar, Tabs } =
        window.VerasigDesignSystem_fd565b
      const { useState } = React

      const Check = () => (
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          strokeWidth="2.2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
      )
      const Plus = () => (
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      )
      const Refresh = () => (
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5" />
        </svg>
      )

      function Demo() {
        const [tab, setTab] = useState('all')
        const [range, setRange] = useState('24H')
        return (
          <div>
            <div className="grp">
              <div className="lab">Button</div>
              <div className="row">
                <Button variant="primary" iconLeft={<Check />}>
                  Verify signal
                </Button>
                <Button variant="secondary">Cancel</Button>
                <Button variant="ghost">Details</Button>
                <Button variant="danger">Reject</Button>
                <Button variant="primary" loading>
                  Verifying
                </Button>
                <Button variant="primary" size="sm">
                  Small
                </Button>
                <Button variant="secondary" disabled>
                  Disabled
                </Button>
              </div>
            </div>

            <div className="grp">
              <div className="lab">IconButton · Avatar</div>
              <div className="row">
                <IconButton label="Refresh">
                  <Refresh />
                </IconButton>
                <IconButton label="Settings" variant="solid">
                  <Refresh />
                </IconButton>
                <IconButton label="Add" variant="accent">
                  <Plus />
                </IconButton>
                <span
                  style={{
                    width: '1px',
                    height: '28px',
                    background: 'var(--border-default)'
                  }}
                ></span>
                <Avatar name="Mara Voss" status="verified" />
                <Avatar name="Coinbase" square tint="var(--viz-2)" />
                <Avatar name="Stork" size="lg" tint="var(--viz-3)" status="pending" />
              </div>
            </div>

            <div className="grp">
              <div className="lab">Badge · Tag</div>
              <div className="row">
                <Badge tone="verified" dot>
                  Verified
                </Badge>
                <Badge tone="pending" dot>
                  Awaiting quorum
                </Badge>
                <Badge tone="rejected" dot>
                  Spoofed
                </Badge>
                <Badge tone="info">Observing</Badge>
                <Badge tone="outline">v2.4</Badge>
                <Tag swatch="var(--viz-2)">Webhook</Tag>
                <Tag onRemove={() => {}}>Coinbase</Tag>
              </div>
            </div>

            <div className="grp" style={{ marginBottom: 0 }}>
              <div className="lab">Tabs</div>
              <div className="row" style={{ gap: '24px' }}>
                <Tabs
                  value={tab}
                  onChange={setTab}
                  items={[
                    { id: 'all', label: 'All signals', count: 248 },
                    { id: 'pending', label: 'Pending', count: 12 },
                    { id: 'rejected', label: 'Rejected', count: 3 }
                  ]}
                />
                <Tabs
                  variant="pill"
                  value={range}
                  onChange={setRange}
                  items={['1H', '24H', '7D']}
                />
              </div>
            </div>
          </div>
        )
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />)
    </script>
  </body>
</html>
