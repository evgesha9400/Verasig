<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — signal status" subtitle="Verified · Pending · Rejected · Info — the verification states" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .item { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 999px; display: inline-block; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .label { font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--text-heading); }
  .pill { display: inline-block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item">
      <div class="top"><span class="dot" style="background:var(--verified-500)"></span><span class="label">Verified</span></div>
      <span class="pill" style="background:var(--verified-bg);color:var(--verified-500)">Verified</span>
      <div class="hex">#B9EE2E</div>
    </div>
    <div class="item">
      <div class="top"><span class="dot" style="background:var(--pending-500)"></span><span class="label">Pending</span></div>
      <span class="pill" style="background:var(--pending-bg);color:var(--pending-500)">Awaiting quorum</span>
      <div class="hex">#F5B544</div>
    </div>
    <div class="item">
      <div class="top"><span class="dot" style="background:var(--rejected-500)"></span><span class="label">Rejected</span></div>
      <span class="pill" style="background:var(--rejected-bg);color:var(--rejected-500)">Spoofed</span>
      <div class="hex">#FB6A5E</div>
    </div>
    <div class="item">
      <div class="top"><span class="dot" style="background:var(--info-500)"></span><span class="label">Info</span></div>
      <span class="pill" style="background:var(--info-bg);color:var(--info-500)">Observing</span>
      <div class="hex">#5197FF</div>
    </div>
  </div>
</body>
</html>
