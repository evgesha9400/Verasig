<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .col h4 { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px; }
  .yes h4 { color: var(--accent-text); }
  .no h4 { color: var(--rejected-500); }
  .line { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 9px; font-family: var(--font-sans); font-size: 13.5px; line-height: 1.4; }
  .yes .line { color: var(--text-body); }
  .no .line { color: var(--text-muted); }
  .gly { font-family: var(--font-mono); flex: none; }
  .yes .gly { color: var(--accent); }
  .no .gly { color: var(--rejected-500); }
</style>
</head>
<body>
  <div class="col yes">
    <h4>We say</h4>
    <div class="line"><span class="gly">+</span><span>Verified in 180&nbsp;ms across 12 sources.</span></div>
    <div class="line"><span class="gly">+</span><span>Hold any signal that fails quorum.</span></div>
    <div class="line"><span class="gly">+</span><span>One integration. Every channel.</span></div>
  </div>
  <div class="col no">
    <h4>We don't</h4>
    <div class="line"><span class="gly">&times;</span><span>Revolutionary AI-powered next-gen synergy.</span></div>
    <div class="line"><span class="gly">&times;</span><span>Unlock the power of your data journey!</span></div>
    <div class="line"><span class="gly">&times;</span><span>🚀 Game-changing trust, reimagined.</span></div>
  </div>
</body>
</html>
