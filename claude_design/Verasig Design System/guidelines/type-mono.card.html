<!-- @dsCard group="Type" viewport="700x210" name="Mono — Geist Mono" subtitle="Signal IDs, latencies, metrics & code — tabular figures" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); display:block; margin-bottom:4px; }
  .m { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
  .id { font-size: 15px; color: var(--accent-text); }
  .metric { font-size: 28px; color: var(--text-strong); font-weight: 500; letter-spacing: -0.01em; }
  .unit { font-size: 14px; color: var(--text-muted); }
  .grid { display: flex; gap: 36px; }
</style>
</head>
<body>
  <div class="stack">
    <div><span class="tag">Signal ID</span><span class="m id">SIG-7F2A·QUORUM·0x9d4e1c</span></div>
    <div class="grid">
      <div><span class="tag">Latency p50</span><span class="m metric">182<span class="unit">ms</span></span></div>
      <div><span class="tag">Confidence</span><span class="m metric">99.4<span class="unit">%</span></span></div>
      <div><span class="tag">Sources</span><span class="m metric">12<span class="unit">/12</span></span></div>
    </div>
  </div>
</body>
</html>
