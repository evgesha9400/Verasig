<!-- @dsCard group="Type" viewport="700x130" name="Eyebrow / overline" subtitle="Mono, uppercase, wide-tracked section labels" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); display:flex; gap:40px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .dot { width:6px; height:6px; border-radius:999px; background:var(--accent); display:inline-block; margin-right:8px; vertical-align:middle; }
  h3 { font-family: var(--font-display); font-size: 24px; color: var(--text-heading); }
</style>
</head>
<body>
  <div class="col">
    <span class="v-eyebrow"><span class="dot"></span>Why Verasig</span>
    <h3>The trust layer for signals</h3>
  </div>
  <div class="col">
    <span class="v-eyebrow">Verification · live</span>
    <span class="v-eyebrow" style="color:var(--accent-text)">Quorum 12/12</span>
  </div>
</body>
</html>
