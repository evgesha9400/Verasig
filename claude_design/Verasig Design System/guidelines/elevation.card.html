<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation & glow" subtitle="Deep low-spread shadows + the signal glow for live states" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--bg-app); display: flex; gap: 22px; align-items: center; }
  .item { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .box { width: 92px; height: 64px; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .glow { box-shadow: var(--glow-signal); border-color: transparent; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="tag">xs</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="tag">sm</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="tag">md</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="tag">lg</span></div>
  <div class="item"><div class="box glow"></div><span class="tag">glow-signal</span></div>
</body>
</html>
