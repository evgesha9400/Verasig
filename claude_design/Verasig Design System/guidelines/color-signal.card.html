<!-- @dsCard group="Colors" viewport="700x180" name="Brand — Signal" subtitle="Chartreuse 'live trace' — the one brand accent" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; background: var(--surface-card); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-body); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--signal-700)"></div><div class="meta"><div class="name">700</div><div class="hex">#5A7A10</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--signal-600)"></div><div class="meta"><div class="name">600</div><div class="hex">#8FB81E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--signal-500);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)"></div><div class="meta"><div class="name">500 ·base</div><div class="hex">#B9EE2E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--signal-400)"></div><div class="meta"><div class="name">400</div><div class="hex">#CBF457</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--signal-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#DDF98A</div></div></div>
  </div>
</body>
</html>
