<!-- @dsCard group="Brand" viewport="700x220" name="Signal motifs" subtitle="Lattice grid, ink glow field, and the live trace line" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
  .tile { height: 170px; border-radius: var(--radius-lg); border: 1px solid var(--border-default); position: relative; overflow: hidden; }
  .label { position: absolute; left: 12px; bottom: 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-body); letter-spacing: .06em; z-index: 2; }
  .lattice { background-color: var(--surface-sunken); background-image: linear-gradient(var(--border-subtle) 1px, transparent 1px), linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px); background-size: 26px 26px; }
  .glow { background: radial-gradient(120% 90% at 80% 0%, rgba(185,238,46,0.18), transparent 55%), radial-gradient(80% 70% at 0% 100%, rgba(81,151,255,0.12), transparent 55%), var(--ink-950); }
  .trace { background: var(--ink-950); display:flex; align-items:center; justify-content:center; }
  .trace svg { width: 80%; }
</style>
</head>
<body>
  <div class="tile lattice"><span class="label">v-lattice</span></div>
  <div class="tile glow"><span class="label">ink glow field</span></div>
  <div class="tile trace">
    <span class="label">live trace</span>
    <svg viewBox="0 0 200 80" fill="none" preserveAspectRatio="none">
      <path d="M0 50 L40 50 L58 50 L74 62 L92 18 L108 44 L124 44 L200 44" stroke="var(--signal-500)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="200" cy="44" r="3.5" fill="var(--signal-500)"/>
    </svg>
  </div>
</body>
</html>
