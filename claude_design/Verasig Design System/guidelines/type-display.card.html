<!-- @dsCard group="Type" viewport="700x230" name="Display — Space Grotesk" subtitle="Headlines & hero — geometric grotesque, tight tracking" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); color: var(--text-heading); }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .line { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-right: 10px; }
  .row { display: flex; align-items: baseline; gap: 4px; }
</style>
</head>
<body>
  <div class="stack">
    <div class="row"><span class="tag">88</span><span class="line" style="font-size:64px">Trust the signal</span></div>
    <div class="row"><span class="tag">36</span><span class="line" style="font-size:36px">Every source, verified</span></div>
    <div class="row"><span class="tag">22</span><span class="line" style="font-size:22px;font-weight:500">Quorum reached in 180ms</span></div>
  </div>
</body>
</html>
