<!-- @dsCard group="Colors" viewport="700x270" name="Ink — neutral scale" subtitle="Cool near-black neutrals: backgrounds, surfaces, text" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 52px; }
  .meta { padding: 6px 8px; background: var(--surface-card); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--text-body); }
  .hex { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--ink-1000)"></div><div class="meta"><div class="name">1000</div><div class="hex">060709</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-950)"></div><div class="meta"><div class="name">950</div><div class="hex">0A0C0F</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="meta"><div class="name">900</div><div class="hex">0E1116</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-850)"></div><div class="meta"><div class="name">850</div><div class="hex">14181E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="meta"><div class="name">800</div><div class="hex">1A1F26</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-750)"></div><div class="meta"><div class="name">750</div><div class="hex">222831</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="meta"><div class="name">700</div><div class="hex">2D343E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="meta"><div class="name">600</div><div class="hex">3B434F</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="meta"><div class="name">500</div><div class="hex">5A626E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="meta"><div class="name">400</div><div class="hex">828B97</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="meta"><div class="name">300</div><div class="hex">AAB2BD</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="meta"><div class="name">200</div><div class="hex">CDD3DB</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-100)"></div><div class="meta"><div class="name">100</div><div class="hex">E7EBEF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-050)"></div><div class="meta"><div class="name">050</div><div class="hex">F5F7F9</div></div></div>
  </div>
</body>
</html>
