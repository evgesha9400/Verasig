<!-- @dsCard group="Brand" viewport="700x520" name="Logo & wordmark" subtitle="Mark, lockup, and clear-space — on dark and light" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel {
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: 28px;
    display: flex; flex-direction: column; gap: 22px;
    align-items: flex-start;
    justify-content: center;
  }
  .panel.dark { background: var(--ink-950); }
  .panel.light { background: #F4F6F8; }
  .lockup { display: inline-flex; align-items: center; gap: 12px; }
  .lockup svg { display: block; }
  .wordmark {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.02em;
  }
  .wordmark .dot { color: var(--signal-500); }
  .dark .wordmark { color: #F5F7F9; }
  .light .wordmark { color: #0A0D11; }
  .mark-row { display: flex; align-items: center; gap: 20px; }
  .chip {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .light .chip { color: #5C6671; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel dark">
      <span class="chip">Primary · on ink</span>
      <div class="lockup">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" style="color:#B9EE2E">
          <path d="M4 22 L11 22 L17 30 L24 9 L30 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="18" r="3.4" fill="currentColor"/>
        </svg>
        <span class="wordmark">Verasig<span class="dot">.</span></span>
      </div>
      <div class="mark-row">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" style="color:#B9EE2E">
          <path d="M4 22 L11 22 L17 30 L24 9 L30 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="18" r="3.4" fill="currentColor"/>
        </svg>
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" style="color:#F5F7F9">
          <path d="M4 22 L11 22 L17 30 L24 9 L30 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="18" r="3.4" fill="currentColor"/>
        </svg>
        <span class="chip">Mark — signal &amp; mono</span>
      </div>
    </div>

    <div class="panel light">
      <span class="chip">On light</span>
      <div class="lockup">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" style="color:#6E9415">
          <path d="M4 22 L11 22 L17 30 L24 9 L30 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="18" r="3.4" fill="currentColor"/>
        </svg>
        <span class="wordmark">Verasig<span class="dot" style="color:#6E9415">.</span></span>
      </div>
      <div class="mark-row">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" style="color:#6E9415">
          <path d="M4 22 L11 22 L17 30 L24 9 L30 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="18" r="3.4" fill="currentColor"/>
        </svg>
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" style="color:#0A0D11">
          <path d="M4 22 L11 22 L17 30 L24 9 L30 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="18" r="3.4" fill="currentColor"/>
        </svg>
        <span class="chip">Mark — ink variants</span>
      </div>
    </div>
  </div>
</body>
</html>
