<style>
  html, body { height: 100%; }
  body { margin: 0; }
  .vx-board { background: var(--bg-app); min-height: 100%; padding: 0 26px 26px; box-sizing: border-box; }
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/verasig-design-system-remix-770ca33e-a7ba-4b8b-b857-928d1a028b4d/_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="ExecutionView.jsx"></script>
<script type="text/babel">
  function ExplorePage() {
    const [tweaks, setTweak] = useTweaks({ controls: 'Segmented' });
    const controls = tweaks.controls === 'Radio cards' ? 'radio' : 'segmented';
    return (
      <>
        <DesignCanvas>
          <DCSection id="execution" title="Execution step — reorganised"
            subtitle="The old Risk step, restructured by trade lifecycle: 01 size → 02 entry → 03 exit. Hover a section to see which rungs of the plan preview it controls.">
            <DCArtboard id="cards" label="A · Stacked cards" width={1190} height={1480}>
              <div className="vx-board" data-screen-label="Execution — A stacked cards">
                <ExecutionView layout="cards" controls={controls} />
              </div>
            </DCArtboard>
            <DCArtboard id="flow" label="B · Numbered flow" width={1190} height={1380}>
              <div className="vx-board" data-screen-label="Execution — B numbered flow">
                <ExecutionView layout="flow" controls={controls} />
              </div>
            </DCArtboard>
            <DCArtboard id="ledger" label="C · Ledger rows" width={1190} height={1245}>
              <div className="vx-board" data-screen-label="Execution — C ledger rows">
                <ExecutionView layout="ledger" controls={controls} />
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
        <TweaksPanel title="Tweaks">
          <TweakSection label="Controls"></TweakSection>
          <TweakRadio label="Choice style" value={tweaks.controls} options={['Segmented', 'Radio cards']} onChange={(v) => setTweak('controls', v)}></TweakRadio>
        </TweaksPanel>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<ExplorePage />);
</script>
</body>
</html>
